# Test-only workflow. It never deploys, never touches GitHub Pages, and uses no secrets.
name: Site preview tests

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "tests/**"
      - "tools/serve.py"
      - "requirements-dev.txt"
      - ".github/workflows/preview-tests.yml"

permissions:
  contents: read

concurrency:
  group: preview-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium firefox webkit
      - name: Run Playwright tests (Chromium, Firefox, WebKit)
        run: python -m pytest tests --browser chromium --browser firefox --browser webkit -q --junitxml=test-results/junit.xml
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
